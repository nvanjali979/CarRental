services:
  kafka:
    image: apache/kafka:4.0.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  credit-card-validation-service:
    image: wiremock/wiremock:3.9.1
    container_name: car-booking-credit-card-mock
    ports:
      - "9090:8080"
    volumes:
      - ./docker/wiremock/mappings:/home/wiremock/mappings:ro

# Skip this service if you are running on host
  car-booking-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: car-booking-app
    ports:
      - "8080:8080"
    depends_on:
      - kafka
      - credit-card-validation-service
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - CREDIT_CARD_VALIDATION_SERVICE_URL=http://credit-card-validation-service:8080/host/credit-card-payment-api
